# The Linux build (docs/WINDOWS-DEPENDENCIES.md §7.4 and §13): what already builds and runs on Linux, from the same
# sources as the Windows build. It grows phase by phase. Its own workflow, so it never holds up the Windows build or
# its release (both stay in build-windows.yml); a red job here shows which part of the port broke, and the first
# compiler errors appear as annotations of the run.
name: Build Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The launcher core (launcher/native/build.sh): libuncharted_native.so and game_starter. Features whose Linux body
  # comes in a later phase answer "not on Linux yet" (§4.1).
  launcher-core:
    name: Launcher core (libuncharted_native.so)
    runs-on: ubuntu-22.04   # glibc 2.35: the oldest system the Linux package is meant for
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-15 libvulkan-dev libcurl4-openssl-dev

      - name: Build
        run: |
          if ! CXX=clang++-15 bash launcher/native/build.sh > build.log 2>&1; then
            cat build.log
            grep -E "error|undefined reference" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cat build.log

      - name: Check the library
        run: |
          echo "exported functions: $(nm -D --defined-only launcher/native/libuncharted_native.so | grep -c ' T un_')"
          echo "libraries it needs:"; objdump -p launcher/native/libuncharted_native.so | grep NEEDED
          clang++-15 -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter -Ilauncher/native launcher/native/core_smoke.cpp \
            -o core_smoke -ldl
          ./core_smoke launcher/native/libuncharted_native.so . | tee smoke.log
          grep FAIL smoke.log | while IFS= read -r l; do echo "::error::core_smoke: $l"; done
          ! grep -q FAIL smoke.log

      - name: Check the process layer
        run: |
          # port.h's Linux process functions (start, pipes, folder, environment, time-outs, process list, kill_tree)
          clang++-15 -std=c++17 -O2 -Wall -Wextra -Ilauncher/native launcher/native/port_smoke.cpp -o port_smoke
          ./port_smoke | tee port.log
          grep FAIL port.log | while IFS= read -r l; do echo "::error::port_smoke: $l"; done
          ! grep -q FAIL port.log

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: launcher-core-linux
          path: |
            launcher/native/libuncharted_native.so
            launcher/native/game_starter

  # The importers (u2import, u3import, u3fix: tools/build_importers_linux.sh, the same sources as
  # tools/package_windows.sh) and the package's build tools. tools/importer_smoke.sh runs the importers' checks that
  # need no game files (usage, code ids, the recipe's step list and fingerprint).
  importers:
    name: Importer core and build tools
    runs-on: ubuntu-24.04   # clang 18: the importers use C++20 that clang 15 and libstdc++ 12 reject
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang zlib1g-dev unzip

      - name: Build the importers
        run: CXX=clang++ bash tools/build_importers_linux.sh

      - name: Importer checks (no game files)
        run: bash tools/importer_smoke.sh

      - name: mkzip and code_ids
        run: |
          for t in "mkzip -std=c++17 tools/mkzip.cpp -lz" "code_ids -std=c++20 tools/code_ids.cpp"; do
            set -- $t
            if ! clang++ -O2 -Wall -Wextra "$2" -o "out/$1" "$3" ${4:-} 2> "out/$1.log"; then
              cat "out/$1.log"; echo "::error title=$3::$(grep -m4 'error' "out/$1.log" | tr '\n' ' ')"; exit 1
            fi
          done
          # a zip of the launcher core's sources, read back by unzip
          out/mkzip out/test.zip launcher/native
          unzip -tq out/test.zip

  # The GPU library's unit tests that need no Vulkan device and no game (gow3_pc/gpu/CMakeLists.txt, the targets
  # outside `if (WIN32)`). Ubuntu 24.04 for a C++23 compiler and library; SDL3 is built from source (no distro
  # package yet). cheat-hook-test and actor-hook-test stay Windows-only until their memory helper has a Linux body
  # (§4.6).
  gpu-tests:
    name: GPU unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDL3_VERSION: release-3.2.0
    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang cmake ninja-build pkg-config glslang-tools \
            libvulkan-dev libfmt-dev libboost-dev libxxhash-dev libx11-dev libxext-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev mesa-vulkan-drivers
          # mesa-vulkan-drivers: lavapipe, a software Vulkan device, for async-pipeline-cache-test
          # names that differ between Ubuntu releases: each one on its own, so a missing one is named
          for p in libvulkan-memory-allocator-dev libvma-dev robin-map-dev libtsl-robin-map-dev libzydis-dev; do
            sudo apt-get install -y -q --no-install-recommends "$p" > /dev/null 2>&1 && echo "installed $p" ||
              echo "::warning::no package $p"
          done

      - name: Reuse SDL3
        id: sdl3
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-${{ env.SDL3_VERSION }}-ubuntu-24.04

      - name: SDL3
        if: steps.sdl3.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b "$SDL3_VERSION" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl"
          cmake -S "$RUNNER_TEMP/sdl" -B "$RUNNER_TEMP/sdl/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/sdl/build"
          cmake --install "$RUNNER_TEMP/sdl/build"

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$HOME/sdl3/lib/pkgconfig:$HOME/sdl3/lib64/pkgconfig"
          if ! cmake -S gow3_pc/gpu -B out/gpu -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_BUILD_TYPE=Release -DGOW3_LTO=OFF -DCMAKE_PREFIX_PATH="$HOME/sdl3" > configure.log 2>&1; then
            cat configure.log
            echo "::error title=configure::$(grep -A4 -m3 'CMake Error' configure.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          cat configure.log

      - name: Build and run the tests
        run: |
          tests=(motion-history-test ui-composition-test async-compiler-test warmup-inbox-test async-pipeline-cache-test
                 depth-stencil-state-test blend-rewrite-test aliasing-test async-fetch-snapshot-test png-decode-test
                 upscaler-support-test orb-multiplier-test stat-multipliers-test perf-overlay-test graphics-settings-test
                 cheat-hooks-test signatures-test readback-queue-test readback-sources-test wait-diagnostics-test
                 page-state-test)
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if ! cmake --build out/gpu --target "$t" > "out/$t.log" 2>&1; then
              cat "out/$t.log"; echo "::endgroup::"
              echo "::error title=$t (build)::$(grep -m4 'error' "out/$t.log" | tr '\n' ' ' | cut -c1-900)"
              failed+=("$t"); continue
            fi
            if ! (cd gow3_pc/gpu && "../../out/gpu/$t") > "out/$t.run" 2>&1; then
              cat "out/$t.run"; echo "::endgroup::"
              echo "::error title=$t (run)::$(tail -n 4 "out/$t.run" | tr '\n' ' ' | cut -c1-900)"
              failed+=("$t"); continue
            fi
            cat "out/$t.run"; echo "::endgroup::"
          done
          echo "${#tests[@]} tests, ${#failed[@]} failed: ${failed[*]}"
          (( ${#failed[@]} == 0 ))
